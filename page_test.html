<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição ECC - Casais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Inscrição de Casais - ECC</h1>
        
        <div id="successMessage" class="alert alert-success d-none">
            ✓ Inscrição enviada com sucesso! Obrigado!
        </div>
        
        <div id="errorMessage" class="alert alert-danger d-none">
            Erro ao enviar. Tente novamente.
        </div>
        
        <form id="inscricaoForm">
            <h3>Dados do Marido</h3>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nome Completo *</label>
                    <input type="text" name="marido_nome" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Nome Usual</label>
                    <input type="text" name="marido_nome_usual" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label>Data de Nascimento</label>
                    <input type="date" name="marido_data_nascimento" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Telefone</label>
                    <input type="tel" name="marido_telefone" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Profissão</label>
                    <input type="text" name="marido_profissao" class="form-control">
                </div>
            </div>
            
            <h3 class="mt-4">Dados da Esposa</h3>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nome Completo *</label>
                    <input type="text" name="esposa_nome" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Nome Usual</label>
                    <input type="text" name="esposa_nome_usual" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label>Data de Nascimento</label>
                    <input type="date" name="esposa_data_nascimento" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Telefone</label>
                    <input type="tel" name="esposa_telefone" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Profissão</label>
                    <input type="text" name="esposa_profissao" class="form-control">
                </div>
            </div>
            
            <h3 class="mt-4">Endereço</h3>
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label>Rua</label>
                    <input type="text" name="endereco" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Número</label>
                    <input type="text" name="numero" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Bairro</label>
                    <input type="text" name="bairro" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Referência</label>
                    <input type="text" name="referencia" class="form-control">
                </div>
            </div>
            
            <h3 class="mt-4">Informações</h3>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Paróquia</label>
                    <input type="text" name="paroquia" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Comunidade</label>
                    <input type="text" name="comunidade" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>E-mail</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Data do Casamento</label>
                    <input type="date" name="data_casamento" class="form-control">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg mt-3">Enviar Inscrição</button>
        </form>
    </div>

    <script>
        const ODOO_URL = 'https://ecc-pnscaparecida.odoo.com';
        const DATABASE = 'ecc-pnscaparecida';
        const USERNAME = 'seu_email@exemplo.com'; // Seu login do Odoo
        const API_KEY = 'SUA_CHAVE_API_AQUI'; // A chave que você gerou

        document.getElementById('inscricaoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            try {
                // Autenticar e criar registro
                const response = await fetch(`${ODOO_URL}/jsonrpc`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'call',
                        params: {
                            service: 'object',
                            method: 'execute_kw',
                            args: [
                                DATABASE,
                                2, // UID (ajuste se necessário)
                                API_KEY,
                                'x_casal',
                                'create',
                                [{
                                    x_studio_marido_nome: data.marido_nome,
                                    x_studio_marido_nome_usual: data.marido_nome_usual,
                                    x_studio_marido_data_nascimento: data.marido_data_nascimento,
                                    x_studio_marido_telefone: data.marido_telefone,
                                    x_studio_marido_profissao: data.marido_profissao,
                                    
                                    x_studio_esposa_nome: data.esposa_nome,
                                    x_studio_esposa_nome_usual: data.esposa_nome_usual,
                                    x_studio_esposa_data_nascimento: data.esposa_data_nascimento,
                                    x_studio_esposa_telefone: data.esposa_telefone,
                                    x_studio_esposa_profissao: data.esposa_profissao,
                                    
                                    x_studio_endereco: data.endereco,
                                    x_studio_numero: data.numero,
                                    x_studio_bairro: data.bairro,
                                    x_studio_referencia: data.referencia,
                                    
                                    x_studio_paroquia: data.paroquia,
                                    x_studio_comunidade: data.comunidade,
                                    x_studio_partner_email: data.email,
                                    x_studio_data_do_casamento: data.data_casamento,
                                }]
                            ]
                        }
                    })
                });

                const result = await response.json();
                
                if (result.result) {
                    document.getElementById('successMessage').classList.remove('d-none');
                    document.getElementById('errorMessage').classList.add('d-none');
                    e.target.reset();
                } else {
                    throw new Error('Falha ao criar registro');
                }
                
            } catch (error) {
                console.error(error);
                document.getElementById('errorMessage').classList.remove('d-none');
                document.getElementById('successMessage').classList.add('d-none');
            }
        });
    </script>
</body>
</html>
