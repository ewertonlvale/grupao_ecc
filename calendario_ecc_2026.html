<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário de Eventos 2026 - ECC</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f5f5f5;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .year {
            font-family: 'Crimson Pro', serif;
            font-size: 3rem;
            font-weight: 700;
            color: #228b22;
            letter-spacing: 5px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Legenda */
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            padding: 12px;
            background: #fafafa;
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .legend-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
        }

        .legend-dot.evento { background: #228b22; }
        .legend-dot.missa { background: #D4A574; }
        .legend-dot.grupao { background: #8B4513; }
        .legend-dot.encontro { background: #9370DB; }
        .legend-dot.arraial { background: #FF6347; }
        .legend-dot.paroquia { background: #4169E1; }

        /* Calendário */
        .month-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .month-container:last-of-type {
            border-bottom: none;
        }

        /* Lado do Calendário */
        .calendar-side {
            background: #fafafa;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .month-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .month-icon { font-size: 1.5rem; }

        .month-name {
            font-family: 'Crimson Pro', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #228b22;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            margin-bottom: 8px;
        }

        .weekday {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: #666;
            padding: 8px 0;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            color: #333;
            position: relative;
            border-radius: 4px;
            background: white;
        }

        .day.other-month {
            color: #ccc;
            background: transparent;
        }

        .day.has-event {
            color: white;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .day.has-event.tipo-evento { background: #228b22; }
        .day.has-event.tipo-missa { background: #D4A574; }
        .day.has-event.tipo-grupao { background: #8B4513; }
        .day.has-event.tipo-encontro { background: #9370DB; }
        .day.has-event.tipo-arraial { background: #FF6347; }
        .day.has-event.tipo-arraia { background: #FF6347; }
        .day.has-event.tipo-paroquia { background: #4169E1; }
        .day.has-event.multiple { background: linear-gradient(135deg, #228b22 0%, #8B4513 100%); }

        /* Lado dos Eventos */
        .events-side {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 15px;
        }

        .event-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #228b22;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .event-card.tipo-missa { border-left-color: #D4A574; background: linear-gradient(to right, #FFFAF5, white); }
        .event-card.tipo-grupao { border-left-color: #8B4513; background: linear-gradient(to right, #FFF8F0, white); }
        .event-card.tipo-encontro { border-left-color: #9370DB; background: linear-gradient(to right, #F9F5FF, white); }
        .event-card.tipo-arraial, .event-card.tipo-arraia { border-left-color: #FF6347; background: linear-gradient(to right, #FFF5F5, white); }
        .event-card.tipo-paroquia { border-left-color: #4169E1; background: linear-gradient(to right, #F0F8FF, white); }

        .event-type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: white;
        }

        .event-type-badge.missa { background: #D4A574; }
        .event-type-badge.grupao { background: #8B4513; }
        .event-type-badge.encontro { background: #9370DB; }
        .event-type-badge.arraial, .event-type-badge.arraia { background: #FF6347; }
        .event-type-badge.evento { background: #228b22; }
        .event-type-badge.paroquia { background: #4169E1; }

        .event-date {
            font-weight: 700;
            color: #228b22;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .event-title {
            font-size: 1rem;
            color: #333;
            line-height: 1.5;
        }

        /* Responsivo */
        @media (max-width: 1200px) {
            .month-container { grid-template-columns: 350px 1fr; gap: 30px; }
        }

        @media (max-width: 900px) {
            .month-container { grid-template-columns: 320px 1fr; gap: 20px; }
        }

        @media (max-width: 768px) {
            body { padding: 15px; }
            .container { padding: 20px; }
            .year { font-size: 2.5rem; }
            .subtitle { font-size: 0.9rem; }
            .month-container { grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px; }
            .legend { flex-direction: column; gap: 12px; align-items: flex-start; }
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .year { font-size: 2rem; }
            .month-name { font-size: 1.4rem; }
            .day { font-size: 0.85rem; }
            .event-card { padding: 15px; }
        }

        /* Impressão / PDF */
        @media print {
            body { padding: 0; background: white; }
            .container { box-shadow: none; padding: 15px; max-width: 100%; }
            .month-container {
                break-inside: avoid;
                page-break-inside: avoid;
                margin-bottom: 20px;
                padding-bottom: 15px;
            }
            .print-btn { display: none !important; }
        }

        /* Botão Imprimir */
        .print-btn {
            display: block;
            margin: 0 auto 30px;
            padding: 12px 30px;
            background: #228b22;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 139, 34, 0.3);
            transition: all 0.3s;
        }

        .print-btn:hover {
            background: #1a6e1a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="year">2026</div>
            <div class="subtitle">Calendário ECC • Encontro de Casais com Cristo</div>
        </div>

        <!-- Botão Imprimir -->
        <button class="print-btn" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>

        <!-- Legenda -->
        <div class="legend">
            <div class="legend-item"><div class="legend-dot evento"></div><span>Evento</span></div>
            <div class="legend-item"><div class="legend-dot missa"></div><span>Missa</span></div>
            <div class="legend-item"><div class="legend-dot grupao"></div><span>Grupão</span></div>
            <div class="legend-item"><div class="legend-dot encontro"></div><span>Encontro</span></div>
            <div class="legend-item"><div class="legend-dot arraial"></div><span>Arraiá</span></div>
        </div>

        <!-- Calendário renderizado -->
        <div id="calendario"></div>
    </div>

    <script>
        // ==========================================
        // DADOS DO CALENDÁRIO (extraídos do Excel)
        // ==========================================
        const eventos = [
            { nome: 'Missa de Abertura das Atividades do ECC', dataInicio: '2026-01-31', dataFim: null, tipo: 'Missa' },
            { nome: '1º Grupão', dataInicio: '2026-02-07', dataFim: null, tipo: 'Grupão' },
            { nome: '2º Grupão e Adoração', dataInicio: '2026-02-28', dataFim: null, tipo: 'Grupão' },
            { nome: '3º Grupão', dataInicio: '2026-03-14', dataFim: null, tipo: 'Grupão' },
            { nome: '4º Grupão', dataInicio: '2026-03-28', dataFim: null, tipo: 'Grupão' },
            { nome: '5º Grupão de Páscoa', dataInicio: '2026-04-18', dataFim: null, tipo: 'Grupão' },
            { nome: 'Feijoada das Famílias', dataInicio: '2026-05-17', dataFim: null, tipo: 'Evento' },
            { nome: '6º Grupão das Mães', dataInicio: '2026-05-30', dataFim: null, tipo: 'Grupão' },
            { nome: 'Arraiá das Famílias', dataInicio: '2026-06-06', dataFim: null, tipo: 'Arraiá' },
            { nome: '7º Grupão', dataInicio: '2026-06-27', dataFim: null, tipo: 'Grupão' },
            { nome: 'Espiritualidade', dataInicio: '2026-07-19', dataFim: null, tipo: 'Encontro' },
            { nome: 'Missa de Envio', dataInicio: '2026-07-22', dataFim: null, tipo: 'Missa' },
            { nome: 'XXV ECC - 24, 25 e 26', dataInicio: '2026-07-24', dataFim: '2026-07-26', tipo: 'Encontro' },
            { nome: 'Pós-Encontro', dataInicio: '2026-08-01', dataFim: null, tipo: 'Grupão' },
            { nome: 'Lazer do ECC', dataInicio: '2026-08-02', dataFim: null, tipo: 'Evento' },
            { nome: '8º Grupão dos Pais', dataInicio: '2026-08-15', dataFim: null, tipo: 'Grupão' },
            { nome: '9º Grupão – Estrutura', dataInicio: '2026-08-29', dataFim: null, tipo: 'Grupão' },
            { nome: '10º Grupão e Adoração', dataInicio: '2026-09-12', dataFim: null, tipo: 'Grupão' },
            { nome: '11º Grupão – Objetivos Pastorais', dataInicio: '2026-09-26', dataFim: null, tipo: 'Grupão' },
            { nome: '12º Grupão', dataInicio: '2026-10-17', dataFim: null, tipo: 'Grupão' },
            { nome: 'Grupão Foranio Sudeste', dataInicio: '2026-11-07', dataFim: null, tipo: 'Grupão' },
            { nome: '13º Grupão', dataInicio: '2026-11-14', dataFim: null, tipo: 'Grupão' },
            { nome: '14º Grupão (Revelação)', dataInicio: '2026-12-12', dataFim: null, tipo: 'Grupão' },
            { nome: 'Encerramento das Atividades do ECC 2026', dataInicio: '2026-12-19', dataFim: null, tipo: 'Missa' }
        ];

        // ==========================================
        // CONFIGURAÇÕES
        // ==========================================
        const mesesNomes = {
            '01': 'Janeiro', '02': 'Fevereiro', '03': 'Março', '04': 'Abril',
            '05': 'Maio', '06': 'Junho', '07': 'Julho', '08': 'Agosto',
            '09': 'Setembro', '10': 'Outubro', '11': 'Novembro', '12': 'Dezembro'
        };

        const mesesIcones = {
            '01': '❄️', '02': '💝', '03': '🌸', '04': '🌧️',
            '05': '🌻', '06': '☀️', '07': '🌞', '08': '🎆',
            '09': '🍂', '10': '👸🏽', '11': '🍁', '12': '🎄'
        };

        function normalizarTipo(tipo) {
            return tipo.toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function formatarData(dataInicioStr, dataFimStr) {
            const dataInicio = new Date(dataInicioStr + 'T00:00:00');
            const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

            if (!dataFimStr || dataInicioStr === dataFimStr) {
                const dia = String(dataInicio.getDate()).padStart(2, '0');
                const mes = String(dataInicio.getMonth() + 1).padStart(2, '0');
                const ano = dataInicio.getFullYear();
                return `${diasSemana[dataInicio.getDay()]}, ${dia}/${mes}/${ano}`;
            }

            const dataFim = new Date(dataFimStr + 'T00:00:00');
            const diaInicio = String(dataInicio.getDate()).padStart(2, '0');
            const mesInicio = String(dataInicio.getMonth() + 1).padStart(2, '0');
            const diaFim = String(dataFim.getDate()).padStart(2, '0');
            const mesFim = String(dataFim.getMonth() + 1).padStart(2, '0');

            if (mesInicio === mesFim) {
                return `${diaInicio} a ${diaFim} de ${mesesNomes[mesInicio]}`;
            }
            return `${diaInicio}/${mesInicio} a ${diaFim}/${mesFim}/${dataInicio.getFullYear()}`;
        }

        function gerarCalendarioMes(ano, mes, eventosDoMes) {
            const primeiroDia = new Date(ano, mes - 1, 1);
            const diasNoMes = new Date(ano, mes, 0).getDate();
            const diaSemanaInicio = primeiroDia.getDay();
            const ultimoDiaMesAnterior = new Date(ano, mes - 1, 0).getDate();

            let html = '';

            for (let i = diaSemanaInicio - 1; i >= 0; i--) {
                html += `<div class="day other-month">${ultimoDiaMesAnterior - i}</div>`;
            }

            for (let dia = 1; dia <= diasNoMes; dia++) {
                const dataStr = `${ano}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                const eventosNoDia = eventosDoMes.filter(e => {
                    const fim = e.dataFim || e.dataInicio;
                    return dataStr >= e.dataInicio && dataStr <= fim;
                });

                if (eventosNoDia.length > 1) {
                    html += `<div class="day has-event multiple">${dia}</div>`;
                } else if (eventosNoDia.length === 1) {
                    const tipo = normalizarTipo(eventosNoDia[0].tipo);
                    html += `<div class="day has-event tipo-${tipo}">${dia}</div>`;
                } else {
                    html += `<div class="day">${dia}</div>`;
                }
            }

            const totalDias = diaSemanaInicio + diasNoMes;
            const diasRestantes = totalDias % 7 === 0 ? 0 : 7 - (totalDias % 7);
            for (let dia = 1; dia <= diasRestantes; dia++) {
                html += `<div class="day other-month">${dia}</div>`;
            }

            return html;
        }

        // ==========================================
        // AGRUPAR POR MÊS E RENDERIZAR
        // ==========================================
        const eventosPorMes = {};
        eventos.forEach(e => {
            const mesAno = e.dataInicio.substring(0, 7); // "2026-01"
            if (!eventosPorMes[mesAno]) eventosPorMes[mesAno] = [];
            eventosPorMes[mesAno].push(e);
        });

        const mesesOrdenados = Object.keys(eventosPorMes).sort();
        let html = '';

        mesesOrdenados.forEach(mesAno => {
            const [ano, mes] = mesAno.split('-');
            const evts = eventosPorMes[mesAno];

            html += `
                <div class="month-container">
                    <div class="calendar-side">
                        <div class="month-header">
                            <div class="month-icon">${mesesIcones[mes]}</div>
                            <div class="month-name">${mesesNomes[mes]}</div>
                        </div>
                        <div class="weekdays">
                            <div class="weekday">D</div><div class="weekday">S</div>
                            <div class="weekday">T</div><div class="weekday">Q</div>
                            <div class="weekday">Q</div><div class="weekday">S</div>
                            <div class="weekday">S</div>
                        </div>
                        <div class="days">
                            ${gerarCalendarioMes(parseInt(ano), parseInt(mes), evts)}
                        </div>
                    </div>
                    <div class="events-side">
            `;

            evts.forEach(evento => {
                const tipo = normalizarTipo(evento.tipo);
                html += `
                    <div class="event-card tipo-${tipo}">
                        <div class="event-type-badge ${tipo}">${evento.tipo}</div>
                        <div class="event-date">${formatarData(evento.dataInicio, evento.dataFim)}</div>
                        <div class="event-title">${evento.nome}</div>
                    </div>
                `;
            });

            html += `</div></div>`;
        });

        document.getElementById('calendario').innerHTML = html;
    </script>
</body>
</html>
