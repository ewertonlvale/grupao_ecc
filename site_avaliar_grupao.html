<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Avaliação do Grupão - ECC</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5VFSZQS0H8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5VFSZQS0H8');
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">  

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        /* Loading Spinner */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a4d2e 0%, #228b22 50%, #2d7a4f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 500;
        }
        
        /* Botão Voltar */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            color: #228b22;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: #228b22;
            color: white;
        }
        
        /* iFrame */
        #appFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            /* Melhorar scroll em mobile */
            -webkit-overflow-scrolling: touch;
            overflow: auto;
        }
        
        /* Mobile: Garantir scroll suave */
        @media (max-width: 768px) {
            body, html {
                overflow: auto;
                -webkit-overflow-scrolling: touch;
            }
            
            #appFrame {
                /* Em mobile, permitir scroll nativo */
                pointer-events: auto;
                touch-action: pan-y;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Carregando Avaliação do Grupão...</div>
    </div>

    <!-- Botão Voltar -->
    <a href="index.html" class="back-button">
        ← Voltar ao Menu
    </a>
    
    <!-- iFrame Principal -->
    <iframe 
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbwqFGhQvUSipBimgBMZGi6DmOwdj_hWth41z4AbmCq7R_B2WXzKclKt3TaoybTY1fZr/exec?page=avaliar"
        title="Avaliação do Grupão - ECC"
        allowfullscreen
        loading="eager"
    ></iframe>

    <script>
        const iframe = document.getElementById('appFrame');
        const loading = document.getElementById('loading');
        
        // Remover loading quando iframe carregar
        iframe.addEventListener('load', function() {
            console.log('✅ Aplicação carregada com sucesso!');
            setTimeout(function() {
                loading.classList.add('hide');
            }, 500);
        });
        
        // Timeout de segurança
        setTimeout(function() {
            if (!loading.classList.contains('hide')) {
                console.warn('⚠️ Loading removido por timeout');
                loading.classList.add('hide');
            }
        }, 10000);
        
        // Log
        console.log('🚀 ECC - Avaliação do Grupão');
        console.log('📍 URL da Aplicação: https://script.google.com/macros/s/AKfycbwqFGhQvUSipBimgBMZGi6DmOwdj_hWth41z4AbmCq7R_B2WXzKclKt3TaoybTY1fZr/exec?page=avaliar');
    </script>
</body>
</html>
