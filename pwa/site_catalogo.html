<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">

    <!-- PWA essentials -->
    <meta name="theme-color" content="#1B2A4A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Catálogo ECC">
    <meta name="application-name" content="Catálogo ECC">

    <title>Catálogo da Comunidade — ECC</title>

    <!-- Manifest + Ícones -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Safe-area iOS (notch) */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            background: #1B2A4A;
        }

        /* Loading Spinner */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1B2A4A 0%, #2C3E6B 60%, #3D5289 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #FAF6F0;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(250, 246, 240, 0.2);
            border-top-color: #C8963E;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Botão Voltar (some em modo standalone) */
        .back-button {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top));
            left: 20px;
            z-index: 1000;
            background: #FAF6F0;
            color: #1B2A4A;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(27, 42, 74, 0.2);
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(27, 42, 74, 0.3);
            background: #C8963E;
            color: #FFFFFF;
        }

        @media (display-mode: standalone) {
            .back-button { display: none; }
        }

        /* iFrame */
        #appFrame {
            width: 100%; height: 100%;
            border: none;
            display: block;
            -webkit-overflow-scrolling: touch;
            overflow: auto;
        }

        /* Banner "Instalar app" (Android) */
        .install-banner {
            display: none;
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 20px; right: 20px;
            z-index: 9998;
            background: #1B2A4A;
            color: #FAF6F0;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            align-items: center;
            gap: 14px;
        }
        .install-banner.show { display: flex; }
        .install-banner img {
            width: 48px; height: 48px;
            border-radius: 12px;
            flex-shrink: 0;
        }
        .install-banner .text {
            flex: 1;
            font-size: 0.92rem;
            line-height: 1.3;
        }
        .install-banner .text strong { display: block; margin-bottom: 2px; }
        .install-banner .btn {
            background: #C8963E;
            color: #FFFFFF;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }
        .install-banner .close {
            background: transparent;
            color: #FAF6F0;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            opacity: 0.6;
        }
        @media (display-mode: standalone) {
            .install-banner { display: none !important; }
        }

        /* Banner LGPD */
        .lgpd-banner {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 10000;
            background: rgba(27, 42, 74, 0.97);
            backdrop-filter: blur(10px);
            color: #FAF6F0;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
        }

        .lgpd-banner.show { display: block; }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .lgpd-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .lgpd-text {
            flex: 1;
            min-width: 250px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .lgpd-buttons {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .lgpd-btn {
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .lgpd-btn-accept {
            background: #C8963E;
            color: #FFFFFF;
        }

        .lgpd-btn-accept:hover {
            background: #E8C87A;
            color: #1B2A4A;
            transform: translateY(-1px);
        }

        .lgpd-btn-reject {
            background: transparent;
            color: #FAF6F0;
            border: 2px solid rgba(250, 246, 240, 0.5);
        }

        .lgpd-btn-reject:hover {
            border-color: #FAF6F0;
            background: rgba(250, 246, 240, 0.1);
        }

        /* Mobile */
        @media (max-width: 768px) {
            body, html {
                overflow: auto;
                -webkit-overflow-scrolling: touch;
            }

            #appFrame {
                pointer-events: auto;
                touch-action: pan-y;
            }

            .lgpd-content {
                flex-direction: column;
                text-align: center;
            }

            .lgpd-buttons {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Carregando Catálogo da Comunidade...</div>
    </div>

    <!-- Botão Voltar (não aparece em modo standalone/instalado) -->
    <a href="index.html" class="back-button">← Voltar ao Menu</a>

    <!-- iFrame Principal -->
    <iframe
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbwo8jU4yLGuVVFhZT8aM0Ga3QwSwSEyyXprVGkZH22z9k8aMwjtggSPQrIQzt9lQayZ/exec?page=catalogo"
        title="Catálogo da Comunidade - ECC"
        allowfullscreen
        loading="eager"
    ></iframe>

    <!-- Banner Instalar (Android/desktop) -->
    <div class="install-banner" id="installBanner">
        <img src="icon-192.png" alt="">
        <div class="text">
            <strong>Instale o Catálogo</strong>
            Abra direto da tela inicial, sem navegador
        </div>
        <button class="btn" id="installBtn">Instalar</button>
        <button class="close" id="installClose" aria-label="Fechar">×</button>
    </div>

    <!-- Banner LGPD -->
    <div class="lgpd-banner" id="lgpdBanner">
        <div class="lgpd-content">
            <div class="lgpd-text">
                🍪 Este site utiliza cookies para análise de uso e melhorias.
                Seus dados não são compartilhados com terceiros.
            </div>
            <div class="lgpd-buttons">
                <button class="lgpd-btn lgpd-btn-accept" id="lgpdAccept">Aceitar</button>
                <button class="lgpd-btn lgpd-btn-reject" id="lgpdReject">Recusar</button>
            </div>
        </div>
    </div>

    <!-- ========== OneSignal Web SDK v16 ========== -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        // CONFIGURAÇÃO: troque ONESIGNAL_APP_ID pelo valor do painel.
        // Veja README_PUSH.md, passo 2.
        window.ONESIGNAL_APP_ID = 'c32ec6d9-f2c7-45ee-8278-6c50b7ed10f2';

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function (OneSignal) {
            if (!window.ONESIGNAL_APP_ID || window.ONESIGNAL_APP_ID.indexOf('COLE-AQUI') === 0) {
                console.warn('[Push] OneSignal App ID não configurado. Notificações desabilitadas.');
                return;
            }
            await OneSignal.init({
                appId: window.ONESIGNAL_APP_ID,
                serviceWorkerPath: 'sw.js',
                serviceWorkerParam: { scope: './' },
                allowLocalhostAsSecureOrigin: true,
                promptOptions: {
                    slidedown: {
                        prompts: [{
                            type: 'push',
                            autoPrompt: true,
                            text: {
                                actionMessage: 'Quer receber avisos de novos comércios e promoções da comunidade?',
                                acceptButton: 'Sim, quero',
                                cancelButton: 'Agora não'
                            },
                            delay: { pageViews: 1, timeDelay: 8 } // aparece após 8s
                        }]
                    }
                }
            });

            // Tag do usuário (útil para segmentar no painel)
            OneSignal.User.addTag('origem', 'catalogo_pwa');
        });
    </script>

    <script>
        // ========== LOADING ==========
        var iframe = document.getElementById('appFrame');
        var loading = document.getElementById('loading');

        iframe.addEventListener('load', function() {
            setTimeout(function() { loading.classList.add('hide'); }, 500);
        });

        setTimeout(function() {
            if (!loading.classList.contains('hide')) loading.classList.add('hide');
        }, 10000);

        // ========== SERVICE WORKER (registrado pelo OneSignal) ==========
        // OBS: NÃO registramos sw.js manualmente aqui — o OneSignal.init() já
        // registra o mesmo sw.js com o scope './'. Registrar duas vezes causa
        // conflito e o push não funciona.

        // ========== INSTALL BANNER (Android / desktop) ==========
        var installPromptEvent = null;
        var installBanner = document.getElementById('installBanner');
        var INSTALL_KEY = 'ecc_install_dismissed_at';

        function shouldShowInstall() {
            var last = null;
            try { last = localStorage.getItem(INSTALL_KEY); } catch(e) {}
            if (!last) return true;
            // cooldown de 7 dias
            var daysAgo = (Date.now() - parseInt(last, 10)) / 86400000;
            return daysAgo > 7;
        }

        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            installPromptEvent = e;
            if (shouldShowInstall()) {
                setTimeout(function() {
                    installBanner.classList.add('show');
                }, 3000);
            }
        });

        document.getElementById('installBtn').addEventListener('click', async function() {
            if (!installPromptEvent) return;
            installBanner.classList.remove('show');
            installPromptEvent.prompt();
            var result = await installPromptEvent.userChoice;
            if (result.outcome === 'accepted') {
                console.log('[PWA] Usuário instalou o app.');
            }
            installPromptEvent = null;
            try { localStorage.setItem(INSTALL_KEY, Date.now().toString()); } catch(e) {}
        });

        document.getElementById('installClose').addEventListener('click', function() {
            installBanner.classList.remove('show');
            try { localStorage.setItem(INSTALL_KEY, Date.now().toString()); } catch(e) {}
        });

        window.addEventListener('appinstalled', function() {
            installBanner.classList.remove('show');
            console.log('[PWA] Instalação concluída.');
        });

        // ========== LGPD + ANALYTICS ==========
        var GA_ID = 'G-5VFSZQS0H8';
        var LGPD_KEY = 'ecc_lgpd_consent';

        function getConsent() {
            try { return localStorage.getItem(LGPD_KEY); } catch(e) { return null; }
        }

        function setConsent(v) {
            try { localStorage.setItem(LGPD_KEY, v); } catch(e) {}
        }

        function loadGA() {
            if (document.querySelector('script[src*="googletagmanager"]')) return;
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
            document.head.appendChild(s);
            window.dataLayer = window.dataLayer || [];
            function gtag() { window.dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', GA_ID);
        }

        function removeGACookies() {
            ['_ga','_gid','_gat'].forEach(function(n) {
                document.cookie = n + '=;expires=Thu,01 Jan 1970 00:00:00 UTC;path=/;';
                document.cookie = n + '=;expires=Thu,01 Jan 1970 00:00:00 UTC;path=/;domain=.' + location.hostname;
            });
        }

        var consent = getConsent();
        if (consent === 'accepted') {
            loadGA();
        } else if (consent === null) {
            setTimeout(function() {
                document.getElementById('lgpdBanner').classList.add('show');
            }, 1000);
        }

        document.getElementById('lgpdAccept').addEventListener('click', function() {
            setConsent('accepted');
            loadGA();
            document.getElementById('lgpdBanner').classList.remove('show');
        });

        document.getElementById('lgpdReject').addEventListener('click', function() {
            setConsent('rejected');
            removeGACookies();
            document.getElementById('lgpdBanner').classList.remove('show');
        });
    </script>
</body>
</html>
